name: office-link-demo

services:
  frontend:
    build:
      context: ../workspace-Final-Front
      dockerfile: Dockerfile
    ports:
      - "${FRONTEND_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-80}:80"
    depends_on:
      final-backend:
        condition: service_healthy
    networks:
      - office-link
    restart: unless-stopped

  final-backend:
    build:
      context: ../workspace-Final-Backend
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://final-postgres:5432/${FINAL_POSTGRES_DB:-metanet}
      SPRING_DATASOURCE_USERNAME: ${FINAL_POSTGRES_USER:-metanet}
      SPRING_DATASOURCE_PASSWORD: ${FINAL_POSTGRES_PASSWORD:?FINAL_POSTGRES_PASSWORD is required}
      SPRING_DATA_REDIS_HOST: final-redis
      SPRING_DATA_REDIS_PORT: 6379
      AI_AGENT_BASE_URL: http://agent:8000/api/v1/chat
      WORKHUB_API_BASE_URL: http://workhub-backend:8081/api/v1
      AUTH_SERVER_TOKEN_URL: http://final-backend:8080/oauth2/token
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      LOG_KAFKA_ENABLED: "true"
      FRONTEND_OAUTH_SUCCESS_REDIRECT_URI: ${PUBLIC_BASE_URL:-http://localhost}/auth/callback
      FRONTEND_OAUTH_FAILURE_REDIRECT_URI: ${PUBLIC_BASE_URL:-http://localhost}/auth/error
      CORS_ALLOWED_ORIGINS: ${PUBLIC_BASE_URL:-http://localhost}
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      REFRESH_TOKEN_COOKIE_SECURE: ${REFRESH_TOKEN_COOKIE_SECURE:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      AZURE_AUTHORITY_TENANT: ${AZURE_AUTHORITY_TENANT:-organizations}
      AZURE_CLIENT_ID: ${AZURE_CLIENT_ID:?AZURE_CLIENT_ID is required}
      AZURE_CLIENT_SECRET: ${AZURE_CLIENT_SECRET:?AZURE_CLIENT_SECRET is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OAUTH_JWT_KEY_ID: ${OAUTH_JWT_KEY_ID:?OAUTH_JWT_KEY_ID is required}
      OAUTH_JWT_PRIVATE_KEY_BASE64: ${OAUTH_JWT_PRIVATE_KEY_BASE64:?OAUTH_JWT_PRIVATE_KEY_BASE64 is required}
      OAUTH_JWT_PUBLIC_KEY_BASE64: ${OAUTH_JWT_PUBLIC_KEY_BASE64:?OAUTH_JWT_PUBLIC_KEY_BASE64 is required}
      CHAT_BACKEND_CLIENT_SECRET: ${CHAT_BACKEND_CLIENT_SECRET:?CHAT_BACKEND_CLIENT_SECRET is required}
      CHAT_BACKEND_WORKHUB_CLIENT_SECRET: ${CHAT_BACKEND_WORKHUB_CLIENT_SECRET:?CHAT_BACKEND_WORKHUB_CLIENT_SECRET is required}
      AI_AGENT_CLIENT_SECRET: ${AI_AGENT_CLIENT_SECRET:?AI_AGENT_CLIENT_SECRET is required}
      MCP_SERVER_CLIENT_SECRET: ${MCP_SERVER_CLIENT_SECRET:?MCP_SERVER_CLIENT_SECRET is required}
      WORKHUB_BACKEND_CLIENT_SECRET: ${WORKHUB_BACKEND_CLIENT_SECRET:?WORKHUB_BACKEND_CLIENT_SECRET is required}
    depends_on:
      final-postgres:
        condition: service_healthy
      final-redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    networks:
      - office-link
    restart: unless-stopped

  agent:
    build:
      context: ../workspace-Final-AI
      dockerfile: orchestrator_agent/Dockerfile
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      MCP_SERVER_URL: http://mcp-server:9000/mcp
      AUTH_SERVER_ISSUER_URI: http://localhost:8080
      AUTH_SERVER_TOKEN_URL: http://final-backend:8080/oauth2/token
      AUTH_SERVER_JWKS_URI: http://final-backend:8080/oauth2/jwks
      REDIS_URL: redis://agent-redis:6379/0
      LOG_API_BASE_URL: http://final-backend:8080/api/v1/logs
      LOG_TOKEN_URL: http://final-backend:8080/oauth2/token
      OPENAI_BASE_URL: ${ONPREM_LLM_BASE_URL:?ONPREM_LLM_BASE_URL is required}
      OPENAI_API_KEY: ${ONPREM_LLM_API_KEY:?ONPREM_LLM_API_KEY is required}
      MCP_CLIENT_SECRET: ${AI_AGENT_CLIENT_SECRET:?AI_AGENT_CLIENT_SECRET is required}
      LOG_CLIENT_SECRET: ${AI_AGENT_CLIENT_SECRET:?AI_AGENT_CLIENT_SECRET is required}
      PLAN_MODEL: ${PLAN_MODEL:-gemma4-finetuned-q4}
      ACTION_MODEL: ${ACTION_MODEL:-gemma4-finetuned-q4}
      RAG_VALIDATION_MODEL: ${RAG_VALIDATION_MODEL:-gemma4-finetuned-q4}
      PLAN_REASONING_EFFORT: ${PLAN_REASONING_EFFORT:-low}
      ACTION_REASONING_EFFORT: ${ACTION_REASONING_EFFORT:-low}
      RAG_VALIDATION_REASONING_EFFORT: ${RAG_VALIDATION_REASONING_EFFORT:-low}
      LLM_VERBOSITY: ${LLM_VERBOSITY:-low}
    depends_on:
      agent-redis:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 8
    networks:
      - office-link
    restart: unless-stopped

  mcp-server:
    build:
      context: ../workspace-mcp-server
      dockerfile: Dockerfile
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 9000
      BUSINESS_API_BASE_URL: http://workhub-backend:8081
      AUTH_SERVER_ISSUER_URI: http://localhost:8080
      AUTH_SERVER_JWKS_URI: http://final-backend:8080/oauth2/jwks
      AUTH_SERVER_TOKEN_URL: http://final-backend:8080/oauth2/token
      WORKHUB_CLIENT_SECRET: ${MCP_SERVER_CLIENT_SECRET:?MCP_SERVER_CLIENT_SECRET is required}
      LOG_API_BASE_URL: http://final-backend:8080/api/v1/logs
      LOG_TOKEN_URL: http://final-backend:8080/oauth2/token
      LOG_CLIENT_SECRET: ${MCP_SERVER_CLIENT_SECRET:?MCP_SERVER_CLIENT_SECRET is required}
      RAG_RERANKER_MODEL_DIR: /root/.cache/huggingface/office-link-rerankers
      RAG_RERANKER_PRELOAD: "true"
    volumes:
      - reranker-cache:/root/.cache/huggingface
    depends_on:
      workhub-backend:
        condition: service_healthy
      final-backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - office-link
    restart: unless-stopped

  workhub-backend:
    build:
      context: ../workspace-Workhub-Backend
      dockerfile: Dockerfile
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://workhub-postgres:5432/${WORKHUB_POSTGRES_DB:-workhub}
      SPRING_DATASOURCE_USERNAME: ${WORKHUB_POSTGRES_USER:-workhub}
      SPRING_DATASOURCE_PASSWORD: ${WORKHUB_POSTGRES_PASSWORD:?WORKHUB_POSTGRES_PASSWORD is required}
      SPRING_FLYWAY_ENABLED: "true"
      AUTH_SERVER_ISSUER_URI: http://localhost:8080
      AUTH_SERVER_JWKS_URI: http://final-backend:8080/oauth2/jwks
      LOG_API_BASE_URL: http://final-backend:8080/api/v1/logs
      LOG_TOKEN_URL: http://final-backend:8080/oauth2/token
      WORKHUB_BACKEND_CLIENT_SECRET: ${WORKHUB_BACKEND_CLIENT_SECRET:?WORKHUB_BACKEND_CLIENT_SECRET is required}
      LOG_CLIENT_SECRET: ${WORKHUB_BACKEND_CLIENT_SECRET:?WORKHUB_BACKEND_CLIENT_SECRET is required}
      REALTIME_SIMULATION_ENABLED: ${REALTIME_SIMULATION_ENABLED:-true}
      WORKHUB_REDIS_HOST: workhub-redis
      WORKHUB_REDIS_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      EMBEDDING_API_BASE_URL: ${EMBEDDING_API_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      RAG_REPROCESSING_ENABLED: ${RAG_REPROCESSING_ENABLED:-true}
    depends_on:
      workhub-postgres:
        condition: service_healthy
      workhub-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "timeout 3 bash -c '</dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 12
    networks:
      - office-link
    restart: unless-stopped

  final-postgres:
    image: postgres:18.4
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${FINAL_POSTGRES_DB:-metanet}
      POSTGRES_USER: ${FINAL_POSTGRES_USER:-metanet}
      POSTGRES_PASSWORD: ${FINAL_POSTGRES_PASSWORD:?FINAL_POSTGRES_PASSWORD is required}
    volumes:
      - final-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${FINAL_POSTGRES_USER:-metanet} -d ${FINAL_POSTGRES_DB:-metanet}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - office-link
    restart: unless-stopped

  workhub-postgres:
    image: pgvector/pgvector:pg18
    ports:
      - "127.0.0.1:15432:5432"
    environment:
      POSTGRES_DB: ${WORKHUB_POSTGRES_DB:-workhub}
      POSTGRES_USER: ${WORKHUB_POSTGRES_USER:-workhub}
      POSTGRES_PASSWORD: ${WORKHUB_POSTGRES_PASSWORD:?WORKHUB_POSTGRES_PASSWORD is required}
    volumes:
      - workhub-postgres-data:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${WORKHUB_POSTGRES_USER:-workhub} -d ${WORKHUB_POSTGRES_DB:-workhub}",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
    networks:
      - office-link
    restart: unless-stopped

  final-redis:
    image: redis:8.8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - final-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - office-link
    restart: unless-stopped

  agent-redis:
    image: redis:8.8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - agent-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - office-link
    restart: unless-stopped

  workhub-redis:
    image: redis:8.8
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - workhub-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - office-link
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.7.0
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 10
    networks:
      - office-link
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["ops"]
    environment:
      KAFKA_CLUSTERS_0_NAME: office-link
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-18090}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - office-link
    restart: unless-stopped

networks:
  office-link:
    name: office-link-demo-net

volumes:
  final-postgres-data:
    name: ${FINAL_POSTGRES_VOLUME:-office-link-demo_final-postgres-data}
  workhub-postgres-data:
    name: ${WORKHUB_POSTGRES_VOLUME:-office-link-demo_workhub-postgres-data}
  final-redis-data:
  agent-redis-data:
  workhub-redis-data:
  kafka-data:
  reranker-cache:
